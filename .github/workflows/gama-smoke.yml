name: GAMA Android smoke
on:
  push:
    branches:
      - gama-apk-v06-localbuild
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download compiled APK
        run: |
          mkdir -p gama-apk
          gh run download 37144396824 -R "$GITHUB_REPOSITORY" -n GAMA-v0.6-debug-apk -D gama-apk
          test -f gama-apk/app-debug.apk
      - name: Install emulator image
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n gama-test -k "system-images;android-36;google_apis;x86_64" --force
      - name: Boot emulator and launch GAMA
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          "$ANDROID_HOME/emulator/emulator" -avd gama-test -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot >/tmp/emulator.log 2>&1 &
          timeout 120 "$ADB" wait-for-device || { tail -120 /tmp/emulator.log; exit 1; }
          timeout 240 bash -c 'until [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done' || { tail -120 /tmp/emulator.log; exit 1; }
          "$ADB" install -r gama-apk/app-debug.apk
          "$ADB" shell am force-stop com.gama.market
          "$ADB" logcat -c
          "$ADB" shell am start -W -n com.gama.market/.MainActivity | tee /tmp/am-start.txt
          sleep 8
          PID="$("$ADB" shell pidof com.gama.market | tr -d "\r")"
          test -n "$PID"
          echo "GAMA process PID=$PID"
          if "$ADB" logcat -d | grep -qE 'FATAL EXCEPTION.*com\.gama\.market|Process: com\.gama\.market.*FATAL'; then
            "$ADB" logcat -d | tail -250
            exit 1
          fi
